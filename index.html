<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Money Collection & Monthly Billing Management System</title>
    <meta name="description" content="Professional money collection and monthly billing management system for owners and field collection staff to track electricity, water, and miscellaneous bills, cash & online payments, balances, and audit logs." />
    <meta property="og:title" content="Money Collection & Monthly Billing Management System" />
    <meta property="og:description" content="Professional money collection and monthly billing management system for owners and field collection staff to track electricity, water, and miscellaneous bills, cash & online payments, balances, and audit logs." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0f172a;
        height: 100%;
      }
      #root {
        min-height: 100vh;
        background: #0f172a;
      }
      .app-initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        z-index: 9999;
      }
      .app-initial-loader .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #3b82f6;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-initial-loader">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
